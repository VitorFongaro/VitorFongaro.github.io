<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitor Fongaro · Portfólio</title>
<meta name="description" content="Portfólio de Vitor Fongaro — desenvolvedor full-stack e game dev. / Portfolio of Vitor Fongaro — full-stack developer and game dev.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23dad4bb'/%3E%3Crect x='4' y='4' width='8' height='8' fill='%234e4b42'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#d1cdb7;
  --bg-2:#c8c3ab;
  --panel:#dcd8c0;
  --ink:#4e4b42;
  --ink-soft:#7b776a;
  --ink-faint:rgba(78,75,66,.25);
  --hi:#b5ad8f;
  --danger:#b4544a;
  --mono:'Share Tech Mono',ui-monospace,monospace;
  --sans:'Noto Sans JP',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-weight:400;
  letter-spacing:.04em;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--ink);color:var(--bg)}
a{color:inherit}

/* ───────── fundo: grade + ruído + vinheta ───────── */
.bg-grid{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    repeating-linear-gradient(0deg,transparent 0 3px,rgba(78,75,66,.035) 3px 4px),
    linear-gradient(90deg,rgba(78,75,66,.06) 1px,transparent 1px) 0 0/48px 48px,
    linear-gradient(0deg,rgba(78,75,66,.06) 1px,transparent 1px) 0 0/48px 48px;
}
.bg-vignette{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 40%,transparent 40%,rgba(60,56,44,.28) 100%);
}
#particles{position:fixed;inset:0;z-index:1;pointer-events:none}
.scan{
  position:fixed;inset:0;z-index:50;pointer-events:none;opacity:.5;
  background:linear-gradient(180deg,transparent 0,rgba(255,255,255,.06) 50%,transparent 100%);
  height:120px;animation:scan 7s linear infinite;
}
@keyframes scan{from{transform:translateY(-140px)}to{transform:translateY(110vh)}}

/* ───────── boot ───────── */
#boot{
  position:fixed;inset:0;z-index:100;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:14px;
  transition:opacity .6s ease, visibility .6s;
}
#boot.done{opacity:0;visibility:hidden}
.boot-box{width:min(520px,calc(100vw - 32px))}
.boot-lines{min-height:190px;white-space:pre-wrap;line-height:1.7}
.boot-bar{height:6px;border:1px solid var(--ink);margin-top:18px;position:relative}
.boot-bar i{position:absolute;inset:0;width:0;background:var(--ink);transition:width .25s}
.boot-skip{margin-top:14px;font-size:12px;color:var(--ink-soft)}
.cursor{display:inline-block;width:.6em;height:1em;background:var(--ink);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ───────── layout ───────── */
.app{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:28px 24px 96px;min-height:100vh;display:flex;flex-direction:column}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.title{
  font-weight:300;font-size:clamp(30px,5vw,52px);letter-spacing:.18em;line-height:1;
  text-transform:uppercase;
}
.title small{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:var(--ink-soft);margin-bottom:10px}
.clock{font-family:var(--mono);font-size:12px;color:var(--ink-soft);text-align:right;line-height:1.6}

.rule{height:1px;background:var(--ink);margin:18px 0 0;position:relative;opacity:.8}
.rule::before,.rule::after{content:"";position:absolute;top:-3px;width:7px;height:7px;background:var(--ink)}
.rule::before{left:0}.rule::after{right:0}

nav.tabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;font:inherit;font-size:14px;letter-spacing:.2em;text-transform:uppercase;
  background:transparent;color:var(--ink);border:0;padding:10px 22px;cursor:pointer;position:relative;
  transition:color .2s;
}
.tab::before{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .22s cubic-bezier(.2,.7,.2,1);z-index:-1}
.tab:hover::before{transform:scaleX(.08)}
.tab[aria-selected="true"]{color:var(--bg)}
.tab[aria-selected="true"]::before{transform:scaleX(1)}
.tab .k{font-family:var(--mono);font-size:10px;opacity:.6;margin-right:8px;letter-spacing:0}

main{flex:1;margin-top:26px;position:relative}
.view{display:none}
.view.active{display:block;animation:viewIn .45s cubic-bezier(.2,.7,.2,1)}
@keyframes viewIn{
  0%{opacity:0;transform:translateX(-10px);filter:blur(2px)}
  30%{opacity:.6}
  35%{opacity:.2}
  100%{opacity:1;transform:none;filter:none}
}

.split{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:32px;align-items:start}

/* ───────── lista estilo menu ───────── */
.section-label{font-family:var(--mono);font-size:12px;letter-spacing:.25em;color:var(--ink-soft);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.section-label::after{content:"";flex:1;height:1px;background:var(--ink-faint)}
.list{list-style:none;display:flex;flex-direction:column;gap:4px}
.item{
  width:100%;text-align:left;font:inherit;font-size:15px;letter-spacing:.08em;color:var(--ink);
  background:rgba(220,216,192,.55);border:0;padding:11px 14px 11px 34px;cursor:pointer;position:relative;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  transition:color .18s;isolation:isolate;
}
.item::before{
  content:"";position:absolute;left:12px;top:50%;width:9px;height:9px;margin-top:-4.5px;background:var(--ink);
  transform:scale(0);transition:transform .18s;
}
.item::after{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .22s cubic-bezier(.2,.7,.2,1);z-index:-1}
.item:hover::before,.item:focus-visible::before{transform:scale(1)}
.item.sel{color:var(--bg)}
.item.sel::after{transform:scaleX(1)}
.item.sel::before{background:var(--bg);transform:scale(1)}
.item:focus-visible{outline:1px dashed var(--ink);outline-offset:3px}
.item .meta{font-family:var(--mono);font-size:12px;opacity:.75;letter-spacing:.05em}

/* ───────── painel de detalhe ───────── */
.panel{
  background:rgba(220,216,192,.78);position:relative;
  box-shadow:0 0 0 1px var(--ink-faint);
}
.panel-head{
  background:var(--ink);color:var(--bg);padding:10px 16px;font-size:15px;letter-spacing:.18em;text-transform:uppercase;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.panel-head .id{font-family:var(--mono);font-size:12px;opacity:.7;letter-spacing:.1em}
.panel-body{padding:20px 22px 24px}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;border:1px solid var(--ink)}
.panel::before{right:-6px;bottom:-6px;border-left:0;border-top:0}
.panel::after{left:-6px;bottom:-6px;border-right:0;border-top:0}
.panel.swap{animation:swap .35s ease}
@keyframes swap{0%{opacity:0;clip-path:inset(0 0 100% 0)}100%{opacity:1;clip-path:inset(0 0 0 0)}}

.desc{line-height:1.85;font-size:15px;font-weight:300;letter-spacing:.03em}
.desc p+p{margin-top:12px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;font-size:14px;margin-top:18px}
.kv dt{font-family:var(--mono);color:var(--ink-soft);letter-spacing:.12em;font-size:12px;padding-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.tag{font-family:var(--mono);font-size:12px;padding:3px 9px;border:1px solid var(--ink);letter-spacing:.08em}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{
  font:inherit;font-size:13px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;
  color:var(--ink);background:transparent;border:1px solid var(--ink);padding:9px 16px 9px 30px;position:relative;cursor:pointer;
  isolation:isolate;transition:color .2s;
}
.btn::before{content:"";position:absolute;left:11px;top:50%;width:7px;height:7px;margin-top:-3.5px;background:currentColor}
.btn::after{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .2s;z-index:-1}
.btn:hover,.btn:focus-visible{color:var(--bg)}
.btn:hover::after,.btn:focus-visible::after{transform:scaleX(1)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}

/* ilustração gerada do projeto */
.art{height:170px;margin:-20px -22px 20px;position:relative;overflow:hidden;background:var(--bg-2);border-bottom:1px solid var(--ink-faint)}
.art svg{width:100%;height:100%;display:block}

/* ───────── status ───────── */
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.portrait{
  aspect-ratio:1;max-width:260px;background:var(--bg-2);position:relative;overflow:hidden;
  box-shadow:0 0 0 1px var(--ink-faint);
}
.portrait svg{width:100%;height:100%}
.bars{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.bar{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:12px;font-size:13px;letter-spacing:.12em}
.bar .track{height:8px;background:rgba(78,75,66,.15);position:relative}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--ink);width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.bar .v{font-family:var(--mono);text-align:right;font-size:12px}
.hp{font-family:var(--mono);font-size:13px;margin-top:14px;display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-soft)}

/* ───────── chips ───────── */
.capacity{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:13px;margin-bottom:16px}
.capacity .track{flex:1;height:10px;border:1px solid var(--ink);position:relative}
.capacity .fill{position:absolute;inset:1px auto 1px 1px;background:var(--ink);transition:width .6s}
.chip-size{display:flex;gap:3px}
.chip-size i{width:10px;height:10px;border:1px solid currentColor}
.chip-size i.on{background:currentColor}

/* ───────── rodapé de comandos ───────── */
footer.hint{
  position:fixed;left:0;right:0;bottom:0;z-index:3;
  background:linear-gradient(0deg,var(--bg) 60%,transparent);
  padding:22px 24px 14px;
}
.hint-inner{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;gap:16px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--ink-soft);letter-spacing:.1em;flex-wrap:wrap}
.keys{display:flex;gap:18px;flex-wrap:wrap}
.keys b{display:inline-block;border:1px solid var(--ink-soft);padding:0 6px;margin-right:6px;font-weight:400;color:var(--ink)}
.sound-toggle{font:inherit;background:none;border:1px solid var(--ink-soft);color:var(--ink);padding:3px 10px;cursor:pointer;letter-spacing:.1em}

/* ───────── toast estilo "mensagem de sistema" ───────── */
#toast{
  position:fixed;left:50%;top:22px;z-index:60;transform:translate(-50%,-20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);font-size:13px;letter-spacing:.14em;padding:10px 22px;
  transition:all .3s cubic-bezier(.2,.7,.2,1);
}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .app{padding:20px 16px 110px}
  .split,.status-grid{grid-template-columns:1fr;gap:22px}
  .portrait{max-width:200px}
  .bar{grid-template-columns:96px 1fr 40px}
  .keys{display:none}
  .hint-inner{justify-content:flex-end}
  .clock{text-align:left}
  nav.tabs{gap:2px}
  .tab{flex:1 1 auto;padding:9px 6px;font-size:12px;letter-spacing:.08em}
  .tab .k{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  #particles,.scan{display:none}
}

/* ───────── troca de idioma ───────── */
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.lang{display:flex;border:1px solid var(--ink)}
.lang button{
  font-family:var(--mono);font-size:12px;letter-spacing:.15em;background:transparent;color:var(--ink);
  border:0;padding:5px 12px;cursor:pointer;transition:background .2s,color .2s;
}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang button:not([aria-pressed="true"]):hover{background:rgba(78,75,66,.15)}
.dl-list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.dl-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--ink-faint);flex-wrap:wrap}
.dl-row .f{font-family:var(--mono);font-size:13px}
.dl-row .f small{display:block;color:var(--ink-soft);font-size:11px;margin-top:2px}
@media (max-width:820px){
  .top-right{flex-direction:row-reverse;justify-content:space-between;align-items:center;width:100%}
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-vignette"></div>
<canvas id="particles"></canvas>
<div class="scan"></div>
<div id="toast" role="status" aria-live="polite"></div>

<!-- ═════════ BOOT ═════════ -->
<div id="boot" aria-hidden="true">
  <div class="boot-box">
    <div class="boot-lines" id="bootLines"></div>
    <div class="boot-bar"><i id="bootBar"></i></div>
    <div class="boot-skip" data-i18n="bootSkip"></div>
  </div>
</div>

<div class="app">
  <header class="top">
    <h1 class="title"><small data-i18n="kicker"></small>Vitor Fongaro</h1>
    <div class="top-right">
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button data-lang="pt" aria-pressed="true">PT</button>
        <button data-lang="en" aria-pressed="false">EN</button>
      </div>
      <div class="clock" id="clock">—</div>
    </div>
  </header>
  <div class="rule"></div>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="status" aria-selected="true"><span class="k">01</span><span data-i18n="tabStatus"></span></button>
    <button class="tab" role="tab" data-view="quests" aria-selected="false"><span class="k">02</span><span data-i18n="tabQuests"></span></button>
    <button class="tab" role="tab" data-view="chips" aria-selected="false"><span class="k">03</span><span data-i18n="tabChips"></span></button>
    <button class="tab" role="tab" data-view="system" aria-selected="false"><span class="k">04</span><span data-i18n="tabSystem"></span></button>
  </nav>

  <main>
    <!-- ═════════ STATUS ═════════ -->
    <section class="view active" id="view-status" role="tabpanel">
      <div class="status-grid">
        <div>
          <div class="section-label" data-i18n="unitData"></div>
          <div class="panel">
            <div class="panel-head"><span>Vitor Fongaro</span><span class="id">LV. ??</span></div>
            <div class="panel-body">
              <div class="desc" data-i18n-html="bio"></div>
              <dl class="kv" id="statusKv"></dl>
            </div>
          </div>
        </div>
        <div>
          <div class="section-label" data-i18n="attributes"></div>
          <div class="portrait" aria-hidden="true">
            <svg viewBox="0 0 200 200" id="sigil"></svg>
          </div>
          <div class="bars" id="bars" style="margin-top:22px"></div>
          <div class="hp" data-i18n-html="hp"></div>
        </div>
      </div>
    </section>

    <!-- ═════════ MISSÕES ═════════ -->
    <section class="view" id="view-quests" role="tabpanel">
      <div class="split">
        <div>
          <div class="section-label" data-i18n="questLog"></div>
          <ul class="list" id="questList"></ul>
        </div>
        <div class="panel" id="questPanel"></div>
      </div>
    </section>

    <!-- ═════════ CHIPS ═════════ -->
    <section class="view" id="view-chips" role="tabpanel">
      <div class="split">
        <div>
          <div class="section-label" data-i18n="chipsInstalled"></div>
          <div class="capacity"><span data-i18n="capacity"></span><div class="track"><div class="fill" id="capFill"></div></div><span id="capText">0/128</span></div>
          <ul class="list" id="chipList"></ul>
        </div>
        <div class="panel" id="chipPanel"></div>
      </div>
    </section>

    <!-- ═════════ SISTEMA ═════════ -->
    <section class="view" id="view-system" role="tabpanel">
      <div class="split">
        <div>
          <div class="section-label" data-i18n="channels"></div>
          <ul class="list" id="sysList"></ul>
        </div>
        <div class="panel" id="sysPanel"></div>
      </div>
    </section>
  </main>
</div>

<footer class="hint">
  <div class="hint-inner">
    <div class="keys">
      <span><b>Q</b><b>E</b><span data-i18n="keyTabs"></span></span>
      <span class="opt"><b>↑</b><b>↓</b><span data-i18n="keyNav"></span></span>
      <span class="opt"><b>Enter</b><span data-i18n="keyOpen"></span></span>
    </div>
    <button class="sound-toggle" id="soundBtn" aria-pressed="false"></button>
  </div>
</footer>

<script>
/* ════════════════════ TEXTOS (PT / EN) ════════════════════ */

  pt:{
    htmlLang:'pt-BR', title:'Vitor Fongaro · Portfólio',

         <p>Fora dele, faço jogos: o <strong>Reprogrammed</strong>, meu TCC, é um jogo web em que uma androide sobe uma torre resolvendo desafios de lógica de programação. Também ando mexendo com Unity e terror psicológico.</p>`,

    type:'TYPE', status:'STATUS', play:'Play / Open', source:'Source code', classified:'Classified file',

let soundOn = false, actx = null;
try{ soundOn = localStorage.getItem('vf-sound') === '1'; }catch(e){}
function blip(freq=880, dur=.05, type='square', vol=.035){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}

/* ════════════════════ ARTE GERADA PRA CADA MISSÃO ════════════════════ */
function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function rng(seed){ return ()=>{ seed=(seed+0x6D2B79F5)|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function questArt(name){
  const r = rng(hash(name)); let s = '';
  for(let i=0;i<14;i++){
    const x=r()*600, y=r()*170, w=8+r()*90, h=2+r()*(r()<.3?60:10);
    s += `<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" fill="#4e4b42" opacity="${(.08+r()*.35).toFixed(2)}"/>`;
  }
  const cx=420+r()*120, cy=85;
  s += `<circle cx="${cx}" cy="${cy}" r="52" fill="none" stroke="#4e4b42" stroke-width="1" opacity=".55"/>
        <circle cx="${cx}" cy="${cy}" r="34" fill="none" stroke="#4e4b42" stroke-width="1" stroke-dasharray="3 5" opacity=".6">
          <animateTransform attributeName="transform" type="rotate" from="0 ${cx} ${cy}" to="360 ${cx} ${cy}" dur="18s" repeatCount="indefinite"/></circle>
        <rect x="${cx-5}" y="${cy-5}" width="10" height="10" fill="#4e4b42"/>
        <line x1="0" y1="${cy}" x2="${cx-60}" y2="${cy}" stroke="#4e4b42" stroke-width="1" opacity=".35"/>`;
  s += `<text x="20" y="150" font-family="Share Tech Mono" font-size="11" fill="#4e4b42" opacity=".7" letter-spacing="2">SCAN · ${name.toUpperCase()} · ${hash(name).toString(16).toUpperCase().slice(0,6)}</text>`;
  return `<svg viewBox="0 0 600 170" preserveAspectRatio="xMidYMid slice">${s}</svg>`;
}

/* ════════════════════ LISTAS GENÉRICAS ════════════════════ */
function makeList(listEl, panelEl, data, metaFn, renderFn){
  let buttons = [], cur = -1;
  function select(i, quiet){
    if(i===cur) return; cur=i;
    buttons.forEach((b,j)=>b.classList.toggle('sel', j===i));
    panelEl.innerHTML = renderFn(data[i]);
    panelEl.classList.remove('swap'); void panelEl.offsetWidth; panelEl.classList.add('swap');
    if(quiet) sfx.move();
  }
  function render(){
    listEl.innerHTML = '';
    buttons = data.map((d,i)=>{
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.className = 'item'; b.innerHTML = `<span>${L(d.name)}</span><span class="meta">${metaFn(d)}</span>`;
      b.addEventListener('mouseenter', ()=>select(i,true));
      b.addEventListener('focus', ()=>select(i,true));
      b.addEventListener('click', ()=>{ select(i); sfx.select(); if(window.innerWidth<=820) panelEl.scrollIntoView({behavior:'smooth',block:'start'}); });
      li.appendChild(b); listEl.appendChild(li); return b;
    });
    const keep = Math.max(cur,0); cur = -1; select(keep);
  }
  return { get buttons(){return buttons}, get cur(){return cur}, select, render };
}

/* ════════════════════ PARTÍCULAS ════════════════════ */
(function(){
  const c = document.getElementById('particles'), x = c.getContext('2d');
  let W,H,P=[];
  function resize(){ W=c.width=innerWidth*devicePixelRatio; H=c.height=innerHeight*devicePixelRatio; c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px'; }
  resize(); addEventListener('resize',resize);
  for(let i=0;i<38;i++) P.push({x:Math.random(),y:Math.random(),s:2+Math.random()*5,v:.00012+Math.random()*.0004,a:.05+Math.random()*.18,d:Math.random()*Math.PI*2});
  (function loop(tm){
    x.clearRect(0,0,W,H);
    for(const p of P){
      p.y -= p.v; p.x += Math.sin(tm/4000+p.d)*.00012;
      if(p.y<-.02){ p.y=1.02; p.x=Math.random(); }
      x.fillStyle=`rgba(78,75,66,${p.a})`;
      const s=p.s*devicePixelRatio; x.fillRect(p.x*W,p.y*H,s,s);
    }
    requestAnimationFrame(loop);
  })(0);
})();

  let seen = false; try{ seen = sessionStorage.getItem('vf-boot')==='1'; }catch(e){}
  const start = location.hash.slice(1);
  const finish = () => { if(boot.classList.contains('done')) return; boot.classList.add('done'); try{sessionStorage.setItem('vf-boot','1')}catch(e){}; showView(start||'status', true); };
  if(seen || matchMedia('(prefers-reduced-motion: reduce)').matches){ boot.classList.add('done'); showView(start||'status', true); return; }
  const lines = t('boot');
  let li=0, ci=0, txt='';
  function step(){
    if(boot.classList.contains('done')) return;
    if(li>=lines.length){ out.innerHTML = txt + '<span class="cursor"></span>'; bar.style.width='100%'; setTimeout(finish,650); return; }
    const ln = lines[li];
    if(ci<=ln.length){ out.innerHTML = txt + ln.slice(0,ci) + '<span class="cursor"></span>'; ci+=2; setTimeout(step,12); }
    else{ txt += ln + '\n'; li++; ci=0; bar.style.width = (li/lines.length*100)+'%'; setTimeout(step,110); }
  }
  step();
  ['click','keydown','touchstart'].forEach(ev=>boot.addEventListener(ev,finish,{once:true}));
  addEventListener('keydown',finish,{once:true});
})();
</script>
</body>
</html>
